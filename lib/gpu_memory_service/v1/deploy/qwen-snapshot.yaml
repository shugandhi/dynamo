apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: __NAME__-gpu
  namespace: __NAMESPACE__
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: __DEVICE_CLASS__
            count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: gms-v1-qwen-snapshot-e2e
    nvidia.com/snapshot-checkpoint-id: __ARTIFACT_ID__
    nvidia.com/snapshot-is-checkpoint-source: "true"
  annotations:
    nvidia.com/snapshot-target-containers: engine
    nvidia.com/snapshot-artifact-version: "1"
    nvidia.com/snapshot-storage-type: pvc
    nvidia.com/snapshot-storage-base-path: __CHECKPOINT_PATH__
spec:
  restartPolicy: Always
  runtimeClassName: __RUNTIME_CLASS__
  imagePullSecrets:
    - name: __IMAGE_PULL_SECRET__
  nodeSelector:
    kubernetes.io/hostname: __NODE__
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Exists
      effect: NoSchedule
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/block-iouring.json
  resourceClaims:
    - name: shared-gpu
      resourceClaimTemplateName: __NAME__-gpu
  containers:
    - name: gms-server
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      command: [python3, -m, gpu_memory_service.v1.cli]
      args: [--device, "0", --socket-path, /gms/gms-v1.sock]
      resources:
        claims:
          - name: shared-gpu
      volumeMounts:
        - name: gms
          mountPath: /gms
    - name: engine
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      command: [python3, -m, gpu_memory_service.v1.qwen_e2e]
      args:
        - --device
        - "0"
        - --socket-path
        - /gms/gms-v1.sock
        - --artifact-id
        - __ARTIFACT_ID__
        - --standby-marker
        - /state/captured
      env:
        - name: DYN_SNAPSHOT_CONTROL_DIR
          value: /snapshot-control
        - name: GMS_V1_MODEL
          value: __MODEL__
        - name: HF_HOME
          value: __MODEL_CACHE_PATH__
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
      resources:
        claims:
          - name: shared-gpu
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - test -e /snapshot-control/ready-for-snapshot || test -e /state/captured.restored
        periodSeconds: 1
      startupProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - test ! -e /state/captured || test -e /state/captured.restored
        periodSeconds: 1
        failureThreshold: 600
      volumeMounts:
        - name: gms
          mountPath: /gms
        - name: state
          mountPath: /state
        - name: snapshot-control
          mountPath: /snapshot-control
          subPath: engine
        - name: checkpoint-storage
          mountPath: __CHECKPOINT_PATH__
        - name: model-cache
          mountPath: __MODEL_CACHE_PATH__
  volumes:
    - name: gms
      emptyDir: {}
    - name: state
      emptyDir: {}
    - name: snapshot-control
      emptyDir: {}
    - name: checkpoint-storage
      persistentVolumeClaim:
        claimName: __CHECKPOINT_PVC__
    - name: model-cache
      persistentVolumeClaim:
        claimName: __MODEL_CACHE_PVC__
---
apiVersion: nvidia.com/v1alpha1
kind: PodSnapshot
metadata:
  name: __NAME__
  namespace: __NAMESPACE__
  labels:
    nvidia.com/snapshot-checkpoint-id: __ARTIFACT_ID__
spec:
  source:
    podRef:
      name: __NAME__
      uid: __POD_UID__
